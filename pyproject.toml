[project]
name = "lebenchmark"
version = "0.1.0"
description = "Measures how reliably locally-served models call tools, on the chezmoi ecosystem's real tool surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erwin Lejeune" }]
dependencies = [
    # httpx, not requests: the runner needs per-request timeouts and HTTP/2
    # keep-alive against one host for thousands of sequential calls.
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[project.scripts]
lebenchmark = "lebenchmark.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lebenchmark"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
